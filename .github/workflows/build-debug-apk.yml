name: Build debug APK

# Manual/on-demand build of the Phase 1A/1B Protect app as an installable debug APK.
#
# This started as the only place :app could be compiled at all — the sandbox that
# originally wrote it (docs/DEVIATIONS.md section 1) could not reach dl.google.com. :app
# now builds on a normal developer machine too, so this workflow's job is regression
# cover: it must keep matching the local toolchain (AGP 8.9.1 / Gradle 8.13 / JDK 17+ /
# compileSdk 35), or a green run here stops meaning anything.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build-debug-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure required Android SDK packages are installed
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Must cover app/build.gradle.kts's compileSdk (35) and AGP 8.9's default
          # build-tools (35.0.0). AGP can auto-download these, but installing them up
          # front keeps the failure mode obvious if the SDK image ever changes.
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run :core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > gradle-info.log 2>&1
          BUILD_EXIT=$?
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== 'What went wrong' failure summary block ==="
            awk '/^\* What went wrong/{f=1} f{print; n++} n>120{exit}' gradle-info.log
            echo "=== first 'Caused by:' block in full (class + message + first 15 frames) ==="
            awk '/^Caused by:/{f=1} f{print; n++} n>16{exit}' gradle-info.log
            echo "=== last 'Caused by:' block in full (the deepest/root cause) ==="
            tac gradle-info.log | awk '/^Caused by:/{print; f=1; next} f{print; n++} n>16{exit}' | tac
          else
            cat gradle-info.log
          fi
          exit "$BUILD_EXIT"

      - name: Name the APK after the product and version
        id: apk
        run: |
          set -e
          # Portable extraction: grep -oP needs a PCRE-enabled grep and a UTF-8
          # locale, neither of which is guaranteed outside this runner image.
          VERSION_NAME="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WhereAreYou-${VERSION_NAME}-beta-build${{ github.run_number }}.apk"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whereareyou-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Only main publishes a release. Feature branches still run the whole build above,
      # so they get the same regression cover without creating throwaway release tags.
      - name: Publish GitHub Release with the APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-beta.${{ github.run_number }}
          name: "WhereAreYou ${{ steps.apk.outputs.version }} beta (build ${{ github.run_number }})"
          body: |
            Beta build of **Phase 1A/1B**, built by CI from `${{ github.ref_name }}` at
            commit ${{ github.sha }}. Free and open source under Apache-2.0.

            ### What works

            - Protect home screen, add / edit / remove trusted contacts
            - Per-contact capability toggles and the Emergency Callback mode selector
              (defaults to Off, as the spec requires)
            - Permission & readiness screen
            - Local persistence (Room + DataStore)
            - The full domain layer in `:core`: missed-call trigger rules, SMS command
              authentication with replay protection and rate limiting, the compact SMS
              protocol codec, and the safety-session state machine — 120 unit tests

            ### What does not work yet

            The domain layer is **not wired to real platform events**. This build cannot
            respond to a missed call, an SMS command, or a low-battery event, and does not
            read your location or send any SMS. It requests **no dangerous permissions at
            all** — that is deliberate, not an oversight, and is why the readiness screen
            shows everything as "not yet required". Real receivers and transport are
            Phase 1C onward; see `docs/ROADMAP.md`.

            ### Installing

            Debug-signed APK, application ID `com.whereareyou.app.debug`, minSdk 26
            (Android 8.0+). Android will warn about installing from an unknown source. It
            installs beside any future release build, but cannot be upgraded in place to
            a production-signed one.

            Compiled and packaged by CI; treat on-device behaviour as untested. Bug
            reports welcome.
          prerelease: true
          files: dist/*.apk
