name: Build debug APK

# Manual/on-demand build of the Phase 1A/1B Protect app as an installable debug APK.
#
# This started as the only place :app could be compiled at all — the sandbox that
# originally wrote it (docs/DEVIATIONS.md section 1) could not reach dl.google.com. :app
# now builds on a normal developer machine too, so this workflow's job is regression
# cover: it must keep matching the local toolchain (AGP 8.9.1 / Gradle 8.13 / JDK 17+ /
# compileSdk 35), or a green run here stops meaning anything.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build-debug-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure required Android SDK packages are installed
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Must cover app/build.gradle.kts's compileSdk (35) and AGP 8.9's default
          # build-tools (35.0.0). AGP can auto-download these, but installing them up
          # front keeps the failure mode obvious if the SDK image ever changes.
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run :core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > gradle-info.log 2>&1
          BUILD_EXIT=$?
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== 'What went wrong' failure summary block ==="
            awk '/^\* What went wrong/{f=1} f{print; n++} n>120{exit}' gradle-info.log
            echo "=== first 'Caused by:' block in full (class + message + first 15 frames) ==="
            awk '/^Caused by:/{f=1} f{print; n++} n>16{exit}' gradle-info.log
            echo "=== last 'Caused by:' block in full (the deepest/root cause) ==="
            tac gradle-info.log | awk '/^Caused by:/{print; f=1; next} f{print; n++} n>16{exit}' | tac
          else
            cat gradle-info.log
          fi
          exit "$BUILD_EXIT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whereareyou-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: "Debug build #${{ github.run_number }} (Phase 1A/1B, unsigned/debug-signed)"
          body: |
            Automated debug APK build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.

            This is a **debug build of the first Phase 1A/1B milestone** — Protect-mode
            scaffold, trusted-contact CRUD, and the domain layer. There is no real
            SMS/call/location integration yet (see docs/ROADMAP.md and docs/DEVIATIONS.md),
            so the app requests no dangerous permissions and cannot yet respond to a
            missed call, an SMS command, or a low-battery event.

            Application ID is `com.whereareyou.app.debug`, so it installs alongside any
            future release build. Expect bugs and missing features.
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
