name: Build debug APK

# Manual/on-demand build of the Phase 1A/1B Protect app as an installable debug APK.
#
# This exists because the sandbox that originally wrote this app (see docs/DEVIATIONS.md
# section 1) cannot reach dl.google.com, so :app could only be hand-reviewed there, never
# compiled. GitHub-hosted runners have full internet access and ship with an Android SDK
# preinstalled, so this workflow does the actual build/verification that sandbox couldn't.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build-debug-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (17 default, 21 available for :core's toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure required Android SDK packages are installed
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Run :core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build debug APK (diagnostic - find the actual resolved AGP artifact)
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > gradle-info.log 2>&1
          BUILD_EXIT=$?
          echo "=== gradle exit code: $BUILD_EXIT ==="
          echo "=== global Gradle init scripts (if any) ==="
          find "$HOME/.gradle" /usr/share/gradle* /etc/gradle* -path "*init.d*" -type f 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            cat "$f"
          done
          echo "=== ~/.gradle/gradle.properties (if any) ==="
          cat "$HOME/.gradle/gradle.properties" 2>/dev/null || echo "(none)"
          echo "=== DIAGNOSTIC: does BaseVariant.class physically exist in the resolved buildscript classpath jars? ==="
          grep "DIAGNOSTIC classpath jar" gradle-info.log
          echo "=== 'What went wrong' failure summary block ==="
          awk '/^\* What went wrong/{f=1} f{print; n++} n>120{exit}' gradle-info.log
          echo "=== every distinct exception class name that appears as a Caused-by header ==="
          grep -oE "Caused by: [A-Za-z0-9.$]+(Exception|Error)" gradle-info.log | sort -u
          echo "=== first 'Caused by:' block in full (class + message + first 15 frames) ==="
          awk '/^Caused by:/{f=1} f{print; n++} n>16{exit}' gradle-info.log
          echo "=== last 'Caused by:' block in full (the deepest/root cause) ==="
          tac gradle-info.log | awk '/^Caused by:/{print; f=1; next} f{print; n++} n>16{exit}' | tac
          exit "$BUILD_EXIT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whereareyou-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: "Debug build #${{ github.run_number }} (Phase 1A/1B, unsigned/debug-signed)"
          body: |
            Automated debug APK build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.

            This is a **debug build of the first Phase 1A/1B milestone** — Protect-mode
            scaffold, trusted-contact CRUD, and the domain layer. There is no real
            SMS/call/location integration yet (see docs/ROADMAP.md and docs/DEVIATIONS.md).
            Expect bugs and missing features; more fixes are coming.
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
