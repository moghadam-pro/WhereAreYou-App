name: CI

# Runs on every push/PR: unit tests (:core + decoder), lint, debug + unsigned-release build.
# Publishing a release is a separate, tag-triggered workflow (release.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decoder tests
        working-directory: tools/decoder
        run: npm test

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Lint + build (release is unsigned here on purpose)
        run: ./gradlew :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
